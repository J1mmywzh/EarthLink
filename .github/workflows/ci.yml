name: checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.9', architecture: x64 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pip install pytest
      - run: python -m compileall -q earthlink commands tools
      - run: python -m pytest -q tests
      - run: node --test tests/navigation.test.cjs tests/walk.test.cjs tests/footprints.test.cjs
  viewer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.9', architecture: x64 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install playwright@1.65.0 && npx playwright install --with-deps chromium
      - name: fixture viewer
        shell: bash
        run: |
          python tests/serve_fixture.py --port 8765 &
          sleep 2
          node tests/viewer_smoke.mjs http://127.0.0.1:8765/
          node tests/viewer_controls.cjs http://127.0.0.1:8765/
          node tests/viewer_review.cjs http://127.0.0.1:8765/
